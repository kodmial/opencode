name: Continuum CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: continuum-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build coding runner
        run: bun run --cwd packages/opencode build:coding

      - name: Verify coding runner
        shell: bash
        run: |
          set -euo pipefail
          BIN=packages/opencode/dist/opencode-linux-x64/bin/opencode
          test -x "$BIN"
          "$BIN" --version
          HELP="$($BIN --help 2>&1)"
          grep -q "opencode run" <<<"$HELP"
          if grep -Eq "(^|[[:space:]])(web|serve|attach|upgrade|uninstall)([[:space:]]|$)" <<<"$HELP"; then
            echo "::error::Non-coding commands leaked into the optimized CLI"
            exit 1
          fi
          ls -lh "$BIN"
