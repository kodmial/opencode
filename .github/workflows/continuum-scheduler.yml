name: Continuum scheduler

# Manual-only until Continuum's OpenCode executor is switched from the
# upstream installer to this repository's local optimized build.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

jobs:
  schedule:
    uses: kodmial/continuum/.github/workflows/consumer-scheduler.yml@main
    with:
      opencode_workflow: continuum-opencode.yml
      wip_limit: 4
      lease_minutes: 45
      max_attempts: 2
