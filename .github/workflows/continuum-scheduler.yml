name: Continuum scheduler

on:
  workflow_dispatch:
  issues:
    types: [opened, reopened]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: continuum-scheduler
  cancel-in-progress: false

jobs:
  schedule:
    uses: kodmial/continuum/.github/workflows/consumer-scheduler.yml@main
    with:
      opencode_workflow: continuum-opencode.yml
      wip_limit: 4
      lease_minutes: 45
      max_attempts: 2
