name: Continuum scheduler

on:
  workflow_dispatch:
  push:
    branches: [main]
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: continuum-scheduler
  cancel-in-progress: false

jobs:
  schedule:
    uses: kodmial/continuum/.github/workflows/consumer-scheduler.yml@main
    with:
      opencode_workflow: continuum-opencode.yml
      wip_limit: 4
      lease_minutes: 210
      max_attempts: 4
