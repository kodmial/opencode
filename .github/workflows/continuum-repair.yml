name: Continuum repair

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_run:
    workflows: ["Continuum CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  repair:
    uses: kodmial/continuum/.github/workflows/consumer-repair.yml@main
    with:
      opencode_workflow: continuum-opencode.yml
      ci_workflow: Continuum CI
