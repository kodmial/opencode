name: Continuum OpenCode

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Invocation mode"
        required: true
        type: choice
        options:
          - issue
          - resolve-conflict
          - ci-fix
      issue_number:
        description: "Issue number for issue mode"
        required: false
        type: string
      pr_number:
        description: "Pull request number for repair modes"
        required: false
        type: string
      head_ref:
        description: "Pull request head branch"
        required: false
        type: string
      run_id:
        description: "Failed workflow run id"
        required: false
        type: string

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  opencode:
    uses: kodmial/continuum/.github/workflows/consumer-opencode.yml@main
    with:
      mode: ${{ inputs.mode }}
      issue_number: ${{ inputs.issue_number }}
      pr_number: ${{ inputs.pr_number }}
      head_ref: ${{ inputs.head_ref }}
      run_id: ${{ inputs.run_id }}
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
