name: Cleanup inherited workflow runs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-inherited-runs.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel inherited queued and running workflows
        shell: bash
        run: |
          set -euo pipefail
          for status in queued in_progress; do
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?status=$status&per_page=100"               --jq '.workflow_runs[].id' |
            while read -r run_id; do
              [[ -n "$run_id" ]] || continue
              [[ "$run_id" == "$GITHUB_RUN_ID" ]] && continue
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null 2>&1 || true
            done
          done
