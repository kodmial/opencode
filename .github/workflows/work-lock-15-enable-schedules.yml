name: Work Lock 15 enable scheduled callers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/work-lock-15-enable-schedules.yml'

permissions:
  actions: write
  contents: read

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure scheduled workflows are enabled
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in continuum-issue-scheduler.yml continuum-auto-merge.yml; do
            gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/enable"
            state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow" --jq .state)"
            echo "$workflow state=$state"
            [[ "$state" == "active" ]] || {
              echo "::error::$workflow did not become active"
              exit 1
            }
          done
